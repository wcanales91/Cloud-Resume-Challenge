AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Resume Challenge Backend - DynamoDB, Lambda, and API Gateway
Resources:
  VisitorCountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
  GetVisitorCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetVisitorCount
      CodeUri: GetVisitorCountFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: VisitorCountTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VisitorCountTable
      Events:
        GetCountApi:
          Type: Api
          Properties:
            Path: /get-count
            Method: get
    Metadata:
      SamResourceId: GetVisitorCountFunction
Outputs:
  VisitorCountApiEndpoint:
    Description: API Gateway Endpoint URL for Visitor Count
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-count/
